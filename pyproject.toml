[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ydentifi"
dynamic = ["version"]
description = "Official Python client for the Ydentifi identity server."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ydentifi", "mfa", "authentication", "grpc", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43.0",
    "grpcio>=1.83.1",
    "grpcio-status>=1.83.1",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "grpcio-tools>=1.83.1",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://ydentifi.io"
Repository = "https://github.com/ydentifi/python"
Documentation = "https://ydentifi.io/docs"
Issues = "https://github.com/ydentifi/python/issues"

[tool.hatch.version]
path = "src/ydentifi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ydentifi"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["ydentifi"]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "examples"]
# Generated from the protocol definitions; never hand-edited, so never linted.
extend-exclude = ["src/ydentifi/_protogen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PL", "PT", "D"]
ignore = ["PLR2004", "PLR0913"]

# Docstrings follow the Google style: a one-line descriptive summary
# ("Returns one user."), then the rest after a blank line.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "D"]
"examples/*" = ["D"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/ydentifi/_protogen"]
pythonVersion = "3.11"
# Basic mode (not strict). grpcio-tools does not emit .pyi stubs for the
# generated gRPC service classes, so strict mode reports every stub
# attribute as Unknown. Basic mode + the targeted overrides below give
# real type safety on hand-written code without fighting the ecosystem.
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
# Tighten reporting on our hand-written code: genuine bugs we want to catch.
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportMissingImports = "error"
reportInvalidTypeVarUse = "error"
